[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weightlab"
version = "0.1.0"
description = "Auditable local weight-editing research"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
editing = ["numpy>=1.24", "gguf==0.19.0"]

[project.scripts]
weightlab = "weightlab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
